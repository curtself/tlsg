name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: ./scripts/build.sh

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" dist/tlsg --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
